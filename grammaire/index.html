<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammaire — French Interactive Lab</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.2rem;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #64748b;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.3rem;
            color: var(--primary-color);
        }

        .card p {
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            margin-top: 15px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--secondary-color);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="../" class="back-link">← Volver al inicio</a>
        
        <header>
            <h1>📚 Section Grammaire</h1>
            <p class="subtitle">Guías interactivas y recursos de gramática francesa (A2)</p>
        </header>

        <div class="grid">
            <!-- Tarjeta para tu guía de tiempos verbales -->
            <div class="card">
                <div>
                    <h2>French Verb Tenses</h2>
                    <p>Guía interactiva completa sobre los tiempos verbales y conjugaciones esenciales en francés.</p>
                </div>
                <a href="./French%20Verb%20Tenses%20–%20Interactive%20Guide.html" class="btn">Abrir Guía</a>
            </div>

            <!-- Puedes agregar más tarjetas aquí si tienes más archivos en esta carpeta -->
        </div>

        <footer>
            <p>French Interactive Lab</p>
        </footer>
    </div>

</body>
</html>
